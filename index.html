<!DOCTYPE html>
<html>
<head>
  <title>BlockPlayZone</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .topbar{
      background:#111b2e;
      padding:15px;
      text-align:center;
      font-size:20px;
      font-weight:bold;
    }

    .container{
      max-width:800px;
      margin:auto;
      padding:20px;
    }

    .card{
      background:#111b2e;
      padding:20px;
      border-radius:12px;
      margin-top:20px;
    }

    input{
      width:100%;
      padding:10px;
      margin:5px 0;
      border:none;
      border-radius:6px;
    }

    button{
      background:#3b82f6;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:8px;
      cursor:pointer;
      margin-top:10px;
    }

    button:hover{
      background:#2563eb;
    }

    .hidden{
      display:none;
    }

    .settingsIcon{
      position:absolute;
      top:15px;
      right:15px;
      font-size:22px;
      cursor:pointer;
    }

    .settingsMenu{
      position:absolute;
      top:50px;
      right:15px;
      background:#111b2e;
      padding:10px;
      border-radius:10px;
      display:none;
      width:150px;
    }

    .settingsMenu button{
      width:100%;
      margin-top:5px;
    }
  </style>
</head>

<body>

<div class="topbar">
  🎮 BlockPlayZone
</div>

<div class="container">

  <!-- LOGIN -->
  <div id="loginPage" class="card">
    <h2>Login</h2>

    <input id="loginUser" placeholder="Username">
    <input id="loginPass" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="showSignup()">Go to Sign Up</button>

    <p id="loginMsg"></p>
  </div>

  <!-- SIGNUP -->
  <div id="signupPage" class="card hidden">
    <h2>Sign Up</h2>

    <input id="signupUser" placeholder="Username">
    <input id="signupPass" type="password" placeholder="Password">

    <button onclick="signup()">Create Account</button>
    <button onclick="showLogin()">Back to Login</button>

    <p id="signupMsg"></p>
  </div>

  <!-- HOME -->
  <div id="homePage" class="hidden">

    <div class="settingsIcon" onclick="toggleSettings()">⚙️</div>

    <div class="settingsMenu" id="settingsMenu">
      <button onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Welcome, <span id="userDisplay"></span> 👋</h2>
      <p>You are now inside BlockPlayZone.</p>
    </div>

  </div>

</div>

<script>

let currentUser = localStorage.getItem("bpz_currentUser");

/* GET USERS */
function getUsers(){
  let data = localStorage.getItem("bpz_users");
  if(!data) return {};
  try { return JSON.parse(data); }
  catch(e){ return {}; }
}

/* SAVE USERS */
function saveUsers(users){
  localStorage.setItem("bpz_users", JSON.stringify(users));
}

/* SIGNUP */
function signup(){
  let users = getUsers();

  let u = document.getElementById("signupUser").value.trim();
  let p = document.getElementById("signupPass").value.trim();

  if(!u || !p){
    document.getElementById("signupMsg").innerText = "Fill all fields!";
    return;
  }

  if(users[u]){
    document.getElementById("signupMsg").innerText = "User already exists!";
    return;
  }

  users[u] = p;
  saveUsers(users);

  document.getElementById("signupMsg").innerText = "Account created! Now login.";
}

/* LOGIN */
function login(){
  let users = getUsers();

  let u = document.getElementById("loginUser").value.trim();
  let p = document.getElementById("loginPass").value.trim();

  if(users[u] && users[u] === p){
    localStorage.setItem("bpz_currentUser", u);
    currentUser = u;
    loadHome();
  } else {
    document.getElementById("loginMsg").innerText = "Wrong username or password";
  }
}

/* LOAD HOME */
function loadHome(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("signupPage").classList.add("hidden");
  document.getElementById("homePage").classList.remove("hidden");

  document.getElementById("userDisplay").innerText = currentUser;
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("bpz_currentUser");
  location.reload();
}

/* NAV */
function showSignup(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("signupPage").classList.remove("hidden");
}

function showLogin(){
  document.getElementById("signupPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
}

/* SETTINGS */
function toggleSettings(){
  let menu = document.getElementById("settingsMenu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

/* AUTO LOGIN */
if(currentUser){
  loadHome();
}

</script>

</body>
</html>
