<!DOCTYPE html>
<html>
<head>
  <title>BlockPlayZone</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .topbar{
      background:#111b2e;
      padding:15px;
      text-align:center;
      font-size:20px;
      font-weight:bold;
    }

    .layout{
      display:flex;
    }

    .left, .right{
      width:25%;
      padding:10px;
    }

    .center{
      width:50%;
      padding:10px;
    }

    .card{
      background:#111b2e;
      padding:15px;
      border-radius:12px;
      margin-top:10px;
    }

    input, textarea{
      width:100%;
      padding:8px;
      margin-top:5px;
      border:none;
      border-radius:6px;
    }

    button{
      background:#3b82f6;
      color:white;
      border:none;
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
      margin-top:8px;
    }

    button:hover{
      background:#2563eb;
    }

    .hidden{display:none;}

    .badge{
      display:inline-block;
      background:#1e293b;
      padding:5px 8px;
      border-radius:8px;
      margin:3px;
      font-size:13px;
    }

    .group{
      background:#1e293b;
      padding:8px;
      border-radius:8px;
      margin-top:5px;
      cursor:pointer;
    }

    .small{
      font-size:13px;
      opacity:0.8;
    }
  </style>
</head>

<body>

<div class="topbar">
  🎮 BlockPlayZone
</div>

<!-- LOGIN -->
<div id="loginPage" class="card" style="max-width:400px;margin:auto;margin-top:40px;">
  <h2>Login</h2>
  <input id="loginUser" placeholder="Username">
  <input id="loginPass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="showSignup()">Sign Up</button>
  <p id="msg"></p>
</div>

<!-- SIGNUP -->
<div id="signupPage" class="card hidden" style="max-width:400px;margin:auto;margin-top:40px;">
  <h2>Sign Up</h2>
  <input id="signupUser" placeholder="Username">
  <input id="signupPass" type="password" placeholder="Password">
  <button onclick="signup()">Create</button>
  <button onclick="showLogin()">Back</button>
  <p id="signupMsg"></p>
</div>

<!-- HOME -->
<div id="homePage" class="hidden">

  <div class="layout">

    <!-- LEFT: PROFILE -->
    <div class="left">

      <div class="card">
        <h3>👤 Profile</h3>
        <p id="username"></p>

        <p class="small">Bio:</p>
        <p id="bioText"></p>

        <textarea id="bioInput" placeholder="Write your bio..."></textarea>
        <button onclick="saveBio()">Save Bio</button>

        <div id="badges"></div>
      </div>

    </div>

    <!-- CENTER -->
    <div class="center">

      <div class="card">
        <h3>Welcome to BlockPlayZone</h3>
        <p>New social update system is live 🔥</p>
      </div>

      <div class="card">
        <h3>Rules</h3>
        <p class="small">
          • No inappropriate names or content<br>
          • No harmful or unsafe behavior<br>
          • Respect other players<br>
          • Keep groups safe and friendly
        </p>
      </div>

    </div>

    <!-- RIGHT: GROUPS -->
    <div class="right">

      <div class="card">
        <h3>👥 Groups</h3>

        <div class="group">BPZ Developers</div>
        <div class="group">Early Testers</div>
        <div class="group">Creators Club</div>

      </div>

    </div>

  </div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("bpz_users") || "{}");
let currentUser = localStorage.getItem("bpz_currentUser");

let bios = JSON.parse(localStorage.getItem("bpz_bios") || "{}");

/* BADGES */
let badges = {
  "BlockPlayZoneOwner": [
    "👑 OWNER",
    "🛠️ DEV",
    "⭐ VERIFIED",
    "🛡️ ADMIN"
  ]
};

/* SIGNUP */
function signup(){
  let u = signupUser.value;
  let p = signupPass.value;

  if(!u || !p){
    signupMsg.innerText = "Fill all fields!";
    return;
  }

  users[u] = p;
  localStorage.setItem("bpz_users", JSON.stringify(users));

  signupMsg.innerText = "Account created!";
}

/* LOGIN */
function login(){
  let u = loginUser.value;
  let p = loginPass.value;

  if(users[u] && users[u] === p){
    localStorage.setItem("bpz_currentUser", u);
    currentUser = u;
    loadHome();
  } else {
    msg.innerText = "Wrong login";
  }
}

/* HOME */
function loadHome(){
  loginPage.classList.add("hidden");
  signupPage.classList.add("hidden");
  homePage.classList.remove("hidden");

  username.innerText = currentUser;

  bioText.innerText = bios[currentUser] || "No bio yet";

  loadBadges();
}

/* BADGES */
function loadBadges(){
  badgesDiv.innerHTML = "";

  let uBadges = badges[currentUser];

  if(uBadges){
    uBadges.forEach(b=>{
      let d = document.createElement("div");
      d.className = "badge";
      d.innerText = b;
      badgesDiv.appendChild(d);
    });
  }
}

/* BIO */
function saveBio(){
  bios[currentUser] = bioInput.value;
  localStorage.setItem("bpz_bios", JSON.stringify(bios));
  bioText.innerText = bioInput.value;
}

/* NAV */
function showSignup(){
  loginPage.classList.add("hidden");
  signupPage.classList.remove("hidden");
}

function showLogin(){
  signupPage.classList.add("hidden");
  loginPage.classList.remove("hidden");
}

/* AUTO LOGIN */
if(currentUser){
  loadHome();
}

</script>

</body>
</html>
